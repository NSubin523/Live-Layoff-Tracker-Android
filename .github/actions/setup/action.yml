name: Android CI setup
description: Set up Java, Gradle, Android SDK, and fake Firebase configuration
runs:
  using: composite
  steps:
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        distribution: temurin
        java-version: '17'
    - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      with:
        cache-read-only: ${{ github.event_name == 'pull_request' }}
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      with:
        packages: platform-tools
        log-accepted-android-sdk-licenses: false
    - shell: bash
      run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
    - shell: bash
      run: python3 scripts/prepare_ci.py
