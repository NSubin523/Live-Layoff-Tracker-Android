import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
// Inventory resolved runtime JAR and AAR dependencies, including transitives.
gradle.projectsEvaluated {
    rootProject.tasks.register("ciSbom") {
        doLast {
            def modules = [:]
            rootProject.allprojects.each { project ->
                def configuration = project.configurations.findByName("debugRuntimeClasspath")
                if (configuration != null && configuration.canBeResolved) {
                    configuration.incoming.resolutionResult.allComponents.each { component ->
                        if (component.id instanceof ModuleComponentIdentifier) {
                            def id = component.id
                            def encode = { value -> URLEncoder.encode(value, "UTF-8").replace("+", "%20") }
                            def purl = "pkg:maven/${encode(id.group)}/${encode(id.module)}@${encode(id.version)}"
                            modules[purl] = [type: "library", group: id.group, name: id.module,
                                             version: id.version, purl: purl]
                        }
                    }
                }
            }
            if (modules.isEmpty()) throw new GradleException("No runtime dependencies resolved")
            def output = new File(rootProject.projectDir, "build/reports/security/runtime-sbom.json")
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                bomFormat: "CycloneDX", specVersion: "1.5", version: 1,
                components: modules.sort().values().toList()
            ]))
        }
    }
}
